additionalProperties:
  formFields:
    - default: "9001"
      edit: true
      envKey: PANEL_APP_PORT_CONSOLE
      labelEn: Console Port
      labelZh: Console 端口
      required: true
      rule: paramPort
      type: number
    - default: "9000"
      edit: true
      envKey: PANEL_APP_PORT_API
      labelEn: API Port
      labelZh: API 端口
      required: true
      rule: paramPort
      type: number
    - default: "username"
      edit: true
      envKey: PANEL_MINIO_ROOT_USER
      labelEn: root user
      labelZh: 管理员用户名
      required: true
