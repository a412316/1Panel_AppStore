      labelZh: MinIO Console 对外可解析的主机名
      required: true
      type: text
    - default: "https://xx.domain.com"
      edit: true
      envKey: MINIO_SERVER_URL
      labelEn: The hostname that can be resolved by the MinIO
      labelZh: MinIO 对外可解析的主机名
      required: true
