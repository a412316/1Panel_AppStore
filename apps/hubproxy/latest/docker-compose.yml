services:
  hubproxy:
    container_name: ${CONTAINER_NAME}
    restart: always
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT_HTTP}:5000"
    image: ghcr.io/sky22333/hubproxy:latest
    labels:  
      createdBy: "Apps"

networks:  
  1panel-network:  
    external: true
