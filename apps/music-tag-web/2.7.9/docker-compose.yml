services:
  music-tag-web:
    container_name: ${CONTAINER_NAME}
    restart: always
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT_HTTP}:8002"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - "${DATA_PATH}:/app/media:rw"
      - "./data:/app/data"
      - "${DOWNLOAD_PATH}:/app/download:rw"
    image: xhongc/music_tag_web:2.7.9
    labels:  
      createdBy: "Apps"

networks:  
  1panel-network:  
    external: true
